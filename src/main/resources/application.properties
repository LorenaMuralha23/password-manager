spring.application.name=Password Manager

server.port=8080

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 1) Some com o banner \u201cSpring\u201d no console
spring.main.banner-mode=off

# 2) N\u00e3o logar infos de startup (perfis, tempo de boot, beans)
spring.main.log-startup-info=false

# 3) Reduzir verbosidade geral
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.org.apache.catalina=ERROR          
logging.level.org.springframework.boot=ERROR
logging.level.org.springframework.boot.startup=OFF
logging.level.com.zaxxer.hikari=ERROR            
# Se usar Fabric, pode querer:
logging.level.org.hyperledger=ERROR
